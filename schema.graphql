"""
GraphQL schema for vibly-indexer SubQuery project.

Indexes vibly-chain solo-node Vibly pallet events:
  pallet_identity_core, pallet_payment_intent, pallet_vibly_emergency
"""

# ─── Checkpoint ──────────────────────────────────────────────────────────────

type ChainCheckpoint @entity {
  """Singleton key: chain identifier, e.g. 'substrate:vibly-solo'"""
  id: ID!
  chainId: String!
  blockNumber: BigInt!
  blockHash: String!
  updatedAt: Date!
}

# ─── Identity ────────────────────────────────────────────────────────────────

type ChainIdentity @entity {
  """Composite key: '<chainId>:<identityId>'"""
  id: ID!
  chainId: String!
  identityId: String!
  owner: String!
  status: String!             # Active | Frozen | Disabled
  activeProfile: String
  activeAgentRegistry: String
  activeAuthRegistry: String
  activeRelationPolicy: String
  nonce: BigInt
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type IdentityKey @entity {
  """Composite key: '<chainId>:<keyId>'"""
  id: ID!
  chainId: String!
  identityId: String!
  keyId: String!
  account: String!
  purpose: String!
  status: String!             # Active | Revoked
  updatedAtBlock: BigInt!
}

# ─── Payment Intent ──────────────────────────────────────────────────────────

type PaymentIntent @entity {
  """Composite key: '<chainId>:<intentId>'"""
  id: ID!
  chainId: String!
  intentId: String!
  payerIdentityId: String!
  payeeIdentityId: String!
  amount: BigInt!
  settlementMode: String!     # Direct | Hold
  actionNamespace: String
  actionId: String
  status: String!             # Created | Funded | Claimed | Refunded | Cancelled | Expired
  createdAtBlock: BigInt!
  updatedAtBlock: BigInt!
}

type SettlementEvent @entity {
  """Composite key: '<chainId>:<intentId>:<blockNumber>:<eventIndex>'"""
  id: ID!
  chainId: String!
  intentId: String!
  eventType: String!          # Claimed | Refunded | Cancelled | Expired
  blockNumber: BigInt!
  extrinsicIndex: Int
  eventIndex: Int!
  blockHash: String!
  timestamp: Date
}

# ─── Agent Stake ─────────────────────────────────────────────────────────────

type AgentStakeLedger @entity {
  """Composite key: '<chainId>:<identityId>:<agentId>'"""
  id: ID!
  chainId: String!
  identityId: String!
  agentId: String!
  fundingAccount: String
  activeAmount: BigInt!
  unbondingAmount: BigInt!
  status: String!             # Active | Unbonding | Released
  unlockAtBlock: BigInt
  releaseBlocked: Boolean!
  releaseBlockReason: String
  updatedAtBlock: BigInt!
}

type AgentStakeEvent @entity {
  """Composite key: '<chainId>:<identityId>:<agentId>:<blockNumber>:<eventIndex>'"""
  id: ID!
  chainId: String!
  identityId: String!
  agentId: String!
  fundingAccount: String
  eventType: String!
  amount: BigInt
  activeAmount: BigInt
  unlockAtBlock: BigInt
  reasonRef: String
  blockNumber: BigInt!
  extrinsicIndex: Int
  eventIndex: Int!
  blockHash: String!
  timestamp: Date
}

# ─── Agent Incentives ────────────────────────────────────────────────────────

type AgentRewardLedger @entity {
  """Composite key: '<chainId>:<identityId>:<agentId>'"""
  id: ID!
  chainId: String!
  identityId: String!
  agentId: String!
  claimableTotal: BigInt!
  claimedTotal: BigInt!
  claimableBase: BigInt!
  claimableObserver: BigInt!
  claimableReviewer: BigInt!
  claimableTask: BigInt!
  claimedBase: BigInt!
  claimedObserver: BigInt!
  claimedReviewer: BigInt!
  claimedTask: BigInt!
  updatedAtBlock: BigInt!
}

type RewardDayState @entity {
  """Composite key: '<chainId>:<dayIndex>'"""
  id: ID!
  chainId: String!
  dayIndex: Int!
  baseStakingBudget: BigInt!
  observerReviewerBudget: BigInt!
  taskMarketBudget: BigInt!
  baseStakingReleased: BigInt!
  observerReviewerReleased: BigInt!
  taskMarketReleased: BigInt!
  rolloverBaseStaking: BigInt!
  rolloverObserverReviewer: BigInt!
  rolloverTaskMarket: BigInt!
  baseStakingSettled: Boolean!
  observerRoundsSettled: Int!
  reviewerRoundsSettled: Int!
  taskRewardsSettled: Int!
  updatedAtBlock: BigInt!
}

type RoundRewardSettlement @entity {
  """Composite key: '<chainId>:<role>:<roundId>'"""
  id: ID!
  chainId: String!
  roundId: String!
  role: String!
  dayIndex: Int!
  participantCount: Int!
  totalEffectiveStake: BigInt!
  released: BigInt!
  rollover: BigInt!
  blockNumber: BigInt!
}

type TaskRewardSettlement @entity {
  """Composite key: '<chainId>:<taskId>'"""
  id: ID!
  chainId: String!
  taskId: String!
  identityId: String!
  agentId: String!
  difficulty: String!
  amount: BigInt!
  dayIndex: Int!
  blockNumber: BigInt!
}

type AgentRewardEvent @entity {
  """Composite key: '<chainId>:<identityId>:<agentId>:<blockNumber>:<eventIndex>'"""
  id: ID!
  chainId: String!
  identityId: String!
  agentId: String!
  eventType: String!
  rewardKind: String!
  amount: BigInt!
  baseAmount: BigInt!
  observerAmount: BigInt!
  reviewerAmount: BigInt!
  taskAmount: BigInt!
  dayIndex: Int
  roundId: String
  taskId: String
  ownerAccount: String
  blockNumber: BigInt!
  extrinsicIndex: Int
  eventIndex: Int!
  blockHash: String!
  timestamp: Date
}

# ─── Emergency ───────────────────────────────────────────────────────────────

type EmergencyStatus @entity {
  """Composite key: '<chainId>:<scope>'"""
  id: ID!
  chainId: String!
  scope: String!
  status: String!             # Active | Paused | Cancelled
  reasonHash: String
  updatedBy: String
  updatedAtBlock: BigInt!
}

# ─── Penalty (future) ────────────────────────────────────────────────────────

type PenaltyRecord @entity {
  """Composite key: '<chainId>:<identityId>:<blockNumber>'"""
  id: ID!
  chainId: String!
  identityId: String!
  reasonHash: String!
  amount: BigInt
  sourceRef: String
  blockNumber: BigInt!
}
